# Shared supervisord configuration for both Docker image variants.
# The single-container image appends supervisord.surrealdb.conf to this file
# at build time (see the `single` stage in the Dockerfile).

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; A control socket, so the watchdog below can restart the worker. Confined to a
; unix socket inside the container and mode 0700 — supervisord's HTTP control
; interface is unauthenticated, so it must never be a TCP listener.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=uv run --no-sync uvicorn api.main:app --host %(ENV_API_HOST)s --port 5055
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
autostart=true
startsecs=3

[program:worker]
; sh -c so the shell expands ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5} (supervisord's
; own command= does not run through a shell). Falls back to 5 when unset.
command=sh -c "uv run --no-sync surreal-commands-worker --import-modules commands --max-tasks ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5}"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
autostart=true
startsecs=3

[program:frontend]
; HOSTNAME must be forced here: container runtimes inject HOSTNAME=<container/pod
; hostname> at runtime (Podman pods override the image's ENV HOSTNAME=0.0.0.0),
; making Next.js bind to the wrong address (#994). Override with FRONTEND_BIND_HOST.
command=bash -c "/app/scripts/wait-for-api.sh && HOSTNAME=${FRONTEND_BIND_HOST:-0.0.0.0} node server.js"
directory=/app/frontend
environment=NODE_ENV="production",PORT="8502"
passenv=API_URL,NEXT_PUBLIC_API_URL,INTERNAL_API_URL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30
autostart=true
startsecs=10

; Watches for a worker that has stopped consuming and restarts it.
;
; surreal_commands holds a single LIVE subscription with no reconnect: when
; SurrealDB restarts, the worker stays alive and idle while commands queue
; forever, with nothing logged. Source processing, embeddings and every study
; artifact are background commands, so that silence looks exactly like a model
; that never answers.
;
; Its own program rather than a thread inside the worker, so it survives the
; failure it is watching for.
[program:worker-watchdog]
command=uv run --no-sync python scripts/worker_watchdog.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=40
autostart=true
startsecs=5
