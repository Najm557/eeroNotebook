# ─── eeroNotebook — private study notebook stack ──────────────────────────────
# Deployed on the Dev Server at ~/stacks/eeronotebook/ alongside the other
# project stacks, joining the shared monitoring network.
#
#   docker compose up -d --build
#   curl http://localhost:5055/health
#
# TLS and routing are not configured here. mon-traefik reads a watched directory
# of configuration files and no Docker labels, so ingress is registered by
# running ./traefik/setup-ingress.sh once on the host.
#
# Every eeroNotebook component runs as a container (Requirement 13.9). The one
# exception is the inference backend: Metal is unreachable from a Linux
# container on macOS, so the model server stays native and is reached only
# through eeroNotebook-inference. See docs/adr/0004.
# ──────────────────────────────────────────────────────────────────────────────

name: eeronotebook

services:
  # ─── Database ───────────────────────────────────────────────────────────────
  # Deliberately unpublished. The app reaches it over the stack network; host
  # port 8000 is taken by labplatform-app in any case.
  eeronotebook-db:
    image: surrealdb/surrealdb:v2
    container_name: eeronotebook-db
    # List form so an interpolated password containing spaces stays one argument.
    command:
      - "start"
      - "--log"
      - "info"
      - "--user"
      - "${SURREAL_USER:?SURREAL_USER must be set}"
      - "--pass"
      - "${SURREAL_PASSWORD:?SURREAL_PASSWORD must be set}"
      - "rocksdb:/mydata/database.db"
    user: root
    volumes:
      - db_data:/mydata
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    networks:
      - eeronotebook_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "dozzle.enable=true"
      - "dozzle.group=eeronotebook"

  # ─── Inference Gateway ──────────────────────────────────────────────────────
  # The application's only source of inference. Presents one OpenAI-compatible
  # surface and forwards to whichever backend serves the models, so replacing
  # the backend is a change here rather than in the application.
  # Unpublished: reachable only from inside the stack.
  eeronotebook-inference:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: eeronotebook-inference
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      # The backend. This is the only address in the stack that points at the
      # host, and this is the only container permitted to reach it.
      INFERENCE_BACKEND_URL: ${INFERENCE_BACKEND_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Maps to the host's loopback interface on this runtime, which is why the
      # backend can stay bound to 127.0.0.1. On Linux this does NOT reach host
      # loopback — see docs/adr/0004 before relocating this stack.
      - "host.docker.internal:host-gateway"
    networks:
      - eeronotebook_internal
      # monitoring_net is here so mon-uptime-kuma can reach /health/liveliness
      # (Requirement 13.10): all inference depends on this container, and every
      # monitor on this host probes by container name over that network. It is
      # still not published to the host, so Requirement 13.2 holds, and the
      # inference routes still demand LITELLM_MASTER_KEY — reachability alone
      # grants nothing. Only the unauthenticated liveness route is open.
      - monitoring_net
    restart: unless-stopped
    healthcheck:
      # The LiteLLM image ships no curl, so probe with the Python already in it.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "dozzle.enable=true"
      - "dozzle.group=eeronotebook"

  # ─── Identity: database ─────────────────────────────────────────────────────
  # GoTrue's own store, deliberately separate from lh-auth's: a compromise or
  # migration in legendary-hunts must not reach eeroNotebook (ADR 0003).
  # Unpublished, and on the internal network only — nothing outside this stack
  # has any reason to reach it.
  eeronotebook-authdb:
    image: postgres:16-alpine
    container_name: eeronotebook-authdb
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-eeronotebook_auth}
      POSTGRES_DB: ${AUTH_DB_NAME:-eeronotebook_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      # Creates the auth schema GoTrue's first migration assumes already exists.
      # Runs only on an empty data volume. See the file for why it is needed.
      - ./auth-db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - eeronotebook_internal
    restart: unless-stopped
    healthcheck:
      # pg_isready ships with this image. Named user and database, because the
      # default probe checks the "postgres" database, which is not the one
      # GoTrue uses.
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "dozzle.enable=true"
      - "dozzle.group=eeronotebook"

  # ─── Identity: GoTrue ───────────────────────────────────────────────────────
  # Authenticates members and issues JWTs. The application does not consume this
  # directly — a single internal boundary resolves a request to a member, so the
  # provider can be replaced without touching routes (ADR 0003, task 5.2).
  #
  # Same image and version as lh-auth: proven on this host, and a version this
  # team already operates. Unpublished; reached by container name.
  eeronotebook-auth:
    image: public.ecr.aws/supabase/gotrue:v2.188.1
    container_name: eeronotebook-auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"

      # Required, and unprefixed — GoTrue refuses to start without it, which is
      # how lh-auth spells it too. The in-stack address is the honest value:
      # this service is unpublished and reached only by container name, so no
      # external URL would resolve to it. GoTrue uses this to build links and
      # redirect targets, which is inert here — mailer autoconfirm is on and no
      # SMTP exists. If GoTrue is ever fronted by mon-traefik, this becomes that
      # origin.
      API_EXTERNAL_URL: http://eeronotebook-auth:9999

      GOTRUE_DB_DRIVER: postgres
      # Password is hex, so it needs no URL-escaping here. See .env.example.
      GOTRUE_DB_DATABASE_URL: postgres://${AUTH_DB_USER:-eeronotebook_auth}:${AUTH_DB_PASSWORD}@eeronotebook-authdb:5432/${AUTH_DB_NAME:-eeronotebook_auth}?sslmode=disable
      GOTRUE_DB_NAMESPACE: auth

      # The TLS origin from task 4.1. Used in links and as the default redirect
      # target; an empty allow list means no other redirect target is accepted.
      GOTRUE_SITE_URL: https://${EERONOTEBOOK_DOMAIN:-eeronotebook.local}
      GOTRUE_URI_ALLOW_LIST: ""

      # Members are created by the operator. This is a small team, and an open
      # registration endpoint on a study tool holding course material is a
      # liability with no upside (Requirement 4.1).
      GOTRUE_DISABLE_SIGNUP: "true"

      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?GOTRUE_JWT_SECRET must be set}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Short-lived access tokens with rotating refresh tokens. The shared
      # password this replaces never expired at all.
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # No SMTP is configured on this host, so a member who had to confirm by
      # email could never sign in. Operator-created accounts are confirmed on
      # creation instead. Revisit if self-service signup is ever enabled.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"

      # Deliberately higher than lh-auth's 6: that value is tuned for a
      # different application, and this one holds a team's study material.
      GOTRUE_PASSWORD_MIN_LENGTH: "12"

      GOTRUE_LOG_LEVEL: info
    depends_on:
      eeronotebook-authdb:
        condition: service_healthy
    networks:
      - eeronotebook_internal
    restart: unless-stopped
    healthcheck:
      # This image ships no curl — checked before writing the probe, because a
      # curl-based healthcheck on the gateway held the whole stack down in task
      # 2.2. wget and nc are both present; wget is the closer equivalent.
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "-q"
        - "http://localhost:9999/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "dozzle.enable=true"
      - "dozzle.group=eeronotebook"

  # ─── Application ────────────────────────────────────────────────────────────
  # Built from this fork rather than pulled, so the image always matches the
  # branch. The image runs api, worker and frontend under supervisord; the
  # worker is required or source processing and embeddings queue silently.
  eeronotebook-app:
    build:
      context: ..
      target: runtime
    image: eeronotebook-app:local
    container_name: eeronotebook-app
    # Unchanged by the TLS work: mon-traefik reaches this container by name over
    # monitoring_net, so fronting it added no host port and could not collide
    # with anything (Requirement 13.3). These two stay published as the local
    # debugging path.
    ports:
      - "8502:8502"  # Web UI  — served over TLS as https://<EERONOTEBOOK_DOMAIN>
      - "5055:5055"  # REST API — served over TLS as https://api.<EERONOTEBOOK_DOMAIN>
    environment:
      # Encrypts stored provider credentials at rest. Required.
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:?OPEN_NOTEBOOK_ENCRYPTION_KEY must be set}

      SURREAL_URL: ws://eeronotebook-db:8000/rpc
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD}
      SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:-eeronotebook}
      SURREAL_DATABASE: ${SURREAL_DATABASE:-eeronotebook}

      # One background task at a time: this stack shares the inference backend
      # with earovoice-api, and parallel jobs would contend for it.
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"

      # Tokens per embedding chunk, held to nomic-embed-text's 2048-token input
      # window (Requirement 1.4). Forwarded from .env rather than hardcoded, and
      # required here — compose reads .env for interpolation only, so the .env
      # entry would be inert without this line. The application reads chunking
      # constants at import, so this container must be restarted for a change to
      # take effect.
      OPEN_NOTEBOOK_CHUNK_SIZE: ${OPEN_NOTEBOOK_CHUNK_SIZE:-400}

      # Interim gate until per-user identity lands (spec task 5.3). Upstream's
      # auth is a single shared password, which is not the end state.
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD must be set}

      # The HTTPS origin the browser is told to call the API on. Left unset,
      # upstream derives it from the request as https://<host>:5055 — a port
      # mon-traefik neither serves nor terminates TLS on, so the UI would break
      # and API traffic would leave the origin in clear text. The frontend
      # rewrites /api/* to the API inside the image, so one TLS origin covers
      # both (Requirement 13.5). Consequence: the UI is reached by name through
      # the proxy, not by http://<host>:8502, which stays a debugging path only.
      API_URL: https://${EERONOTEBOOK_DOMAIN:-eeronotebook.local}
    volumes:
      - app_data:/app/data
    depends_on:
      eeronotebook-db:
        condition: service_healthy
      eeronotebook-inference:
        condition: service_healthy
    networks:
      - eeronotebook_internal
      - monitoring_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5055/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "dozzle.enable=true"
      - "dozzle.group=eeronotebook"

networks:
  eeronotebook_internal:
    driver: bridge
  monitoring_net:
    external: true
    name: monitoring_net

volumes:
  # Named rather than bind-mounted: file sharing into the runtime's VM is slow
  # enough to matter for a database.
  db_data:
  app_data:
  # GoTrue's store. Not covered by deploy/backup/ yet — that script predates
  # this service and captures db_data and app_data only. Losing this volume
  # loses every member account, so backup coverage is owed before task 5.3
  # makes it the only way in.
  auth_db_data:
